{% load catalog_format %}
<dl class="price-list" aria-label="Escalas de precio">
    <div>
        <dt>1 unidad</dt>
        <dd>{{ producto.precio_unitario|precio_ars }}</dd>
    </div>
    <div>
        <dt>Desde 3</dt>
        <dd>{{ producto.precio_desde_3|precio_ars }} c/u</dd>
    </div>
    <div>
        <dt>Desde 20</dt>
        <dd>{{ producto.precio_desde_20|precio_ars }} c/u</dd>
    </div>
</dl>
